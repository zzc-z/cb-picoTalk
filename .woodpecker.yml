steps:
    test:
        image: python
        commands:
            - apt update
            - apt install -y python3-pytest python3-numpy python3-aiohttp 
            - export PATH=$PATH:$HOME/.local/bin/
            - cd picotalk-python
            - python3 -m pip install .
            - bash test.sh
    reuse:
        image: fsfe/reuse
        commands:
            - reuse lint
