<html>
<head>
    <title>picoTalk</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" type="text/css" href="style.css" />
    <link rel="icon" href="favicon.ico" />
</head>
<body>

<div id="content">

    <h1>picoTalk <img src="owl.svg" height="40px" style="margin-bottom: -5px"/></h1>
    <i>Simple and truely end-to-end encrypted voice calls.</i>

    <noscript>
        <b>JavaScript must be enabled for this site!</b>
    </noscript>

    <div class="box" id="joinRoomForm" style="display: none;">
        <label>Room name</label><input type="text" id="room_name" value=""> <br />
        <label class="optional">Server</label><input type="text" class="optional" id="server_name" value=""> <br />
        <button id="btn_connect">Go</button>
    </div>

    <div class="box" id="joinRoomConfirm" style="display: none;">
        Join the room <b id="joinRoomConfirmName">...</b> <br />
        on server <b id="joinRoomConfirmServer">...</b> <br />
        <label>Name</label><input type="text" id="user_name" value="Anonymous"> <br />
        <label>Password</label><input type="text" id="password" value=""> <br />
        <button id="btn_join">Join</button>
        <button id="btn_dont_join" onclick="window.location.search = ''">Don't Join</button>
    </div>

    <div class="box" id="controlButtons" style="display: none;">
        <button id="btnToggleMute">Mute</button>
        <button id="btnLeave">Leave</button>
    </div>

    <div class="box" id="peerList" style="display: none;">
    </div>

    <div class="box" id="divChat" style="display: none;">
        <h3>Chat</h3>
        <ul id="chatMessages"></ul>
        <input type="text" id="inputChatMessage" />
    </div>

    <div id="divShowLog">
        <a id="btnShowLog">Show Log</a>
    </div>

    <div class="box" id="divLog" style="display: none;">
        <h3>Log</h3>
        <ol id="log"></ol>
    </div>

</div>

<script type="text/javascript" src="nacl.js" charset="utf-8"></script>
<script type="text/javascript" src="nacl-util.js" charset="utf-8"></script>
<script type="text/javascript" src="queue.js" charset="utf-8"></script>
<script type="text/javascript" src="wave-resampler.js" charset="utf-8"></script>
<script type="text/javascript" src="main.js" charset="utf-8"></script>

<div id="footer">
    <a href="https://codeberg.org/tok/picotalk">About</a>
</div>

</body>
</html>
